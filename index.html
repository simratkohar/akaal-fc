<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Akaal FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E1A3A; --navy-2:#16244D; --gold:#F5A623; --gold-2:#FFC65C;
  --bg:#F3F4F8; --card:#FFFFFF; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --win:#16A34A; --draw:#9CA3AF; --loss:#DC2626;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,select{font:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* Header */
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 14px;position:sticky;top:0;z-index:20}
header .wrap{display:flex;align-items:center;gap:12px}
.crest{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:grid;place-items:center;font-family:Archivo;font-weight:900;color:var(--navy);font-size:15px;letter-spacing:-.5px}
header h1{font-family:Archivo;font-weight:800;font-size:20px;letter-spacing:-.3px}
header small{display:block;color:#AEB8D6;font-size:12px;font-weight:500}
.role{margin-left:auto;font-size:12px;font-weight:600;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff}
.role.cap{background:var(--gold);color:var(--navy)}

h2.sec{font-family:Archivo;font-weight:800;font-size:18px;margin:22px 0 10px;letter-spacing:-.2px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(14,26,58,.05)}

/* Hero next match */
.hero{background:radial-gradient(120% 120% at 100% 0%,#2A3B78 0%,var(--navy) 55%);color:#fff;border-radius:22px;padding:20px;margin-top:16px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;bottom:-40px;width:180px;height:180px;border-radius:50%;border:28px solid rgba(245,166,35,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.12);text-transform:uppercase;letter-spacing:.4px}
.chip.gold{background:var(--gold);color:var(--navy)}
.chip.lt{background:#EEF1F8;color:var(--navy-2)}
.vs{display:flex;align-items:center;justify-content:space-between;margin:18px 0 14px;gap:8px}
.team{flex:1;text-align:center;font-family:Archivo;font-weight:800;font-size:17px;line-height:1.2}
.team .b{width:54px;height:54px;border-radius:16px;margin:0 auto 8px;display:grid;place-items:center;font-size:18px;font-weight:900}
.team .b.us{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--navy)}
.team .b.them{background:rgba(255,255,255,.12);color:#fff}
.vs .mid{font-family:Archivo;font-weight:900;font-size:13px;color:#AEB8D6}
.when{display:flex;gap:14px;justify-content:center;font-size:13px;color:#D4DAEC;flex-wrap:wrap}
.when b{color:#fff}
.countdown{text-align:center;margin-top:10px;font-size:12px;color:var(--gold-2);font-weight:600}
.avail{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;position:relative;z-index:1}
.avail button{padding:13px;border-radius:14px;font-weight:700;font-size:15px;background:rgba(255,255,255,.1);color:#fff;transition:.15s}
.avail button.on.yes{background:var(--win)}
.avail button.on.no{background:var(--loss)}
.counts{display:flex;justify-content:center;gap:16px;margin-top:12px;font-size:12px;color:#AEB8D6;position:relative;z-index:1}
.counts b{color:#fff}

/* Last result */
.result{display:flex;align-items:center;padding:16px;gap:12px}
.badge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.badge.V{background:var(--win)}.badge.N{background:var(--draw)}.badge.D{background:var(--loss)}
.result .t{flex:1;min-width:0}
.result .t b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .t span{font-size:12px;color:var(--muted)}
.score{font-family:Archivo;font-weight:900;font-size:22px;letter-spacing:-.5px}

/* Quick stats */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{padding:12px 6px;text-align:center}
.kpi b{font-family:Archivo;font-size:22px;font-weight:900;display:block}
.kpi span{font-size:11px;color:var(--muted);font-weight:600}

/* Lists */
.list .row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.row.click{cursor:pointer}
.date{width:44px;text-align:center;flex:none}
.date b{display:block;font-family:Archivo;font-weight:900;font-size:19px;line-height:1}
.date span{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:12px;color:var(--muted)}
.month{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}

.filters{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 0;padding:0 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;padding:8px 13px;border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line)}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* Leaderboard */
.lb .row{gap:10px}
.rank{width:22px;font-family:Archivo;font-weight:900;color:var(--muted);text-align:center}
.rank.r1{color:var(--gold)}
.av{width:36px;height:36px;border-radius:12px;background:#EEF1F8;color:var(--navy-2);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.val{font-family:Archivo;font-weight:900;font-size:20px}
.bar{height:4px;border-radius:4px;background:#EEF1F8;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:#E7E9F0;border-radius:12px;padding:3px;margin-top:12px}
.seg button{padding:8px 0;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30}
nav .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--navy)}
nav button.on svg{stroke:var(--gold)}

/* FAB */
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(96px + env(safe-area-inset-bottom));background:var(--gold);color:var(--navy);font-weight:800;padding:14px 18px;border-radius:16px;box-shadow:0 8px 24px rgba(245,166,35,.4);z-index:25;font-size:14px}

/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,36,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:5px;background:#CDD1DC;margin:6px auto 12px}
.sheet h3{font-family:Archivo;font-weight:800;font-size:20px;margin-bottom:12px}
.sheet .close{float:right;font-size:14px;font-weight:600;color:var(--muted);padding:4px}
.bigscore{text-align:center;padding:20px 16px;background:var(--navy);color:#fff;border-radius:var(--radius)}
.bigscore .score{font-size:44px}
.bigscore .names{display:flex;justify-content:space-between;font-weight:700;margin-top:4px;font-size:14px}
.ev{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.ev:first-child{border-top:0}
.ev small{color:var(--muted)}
.motm{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(135deg,#FFF6E5,#FFF);border:1px solid #F8DFAE}
.pl{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
.pl span{font-size:13px;padding:5px 10px;border-radius:999px;background:#EEF1F8}
.pl span.y{background:#DCFCE7;color:#166534}.pl span.n{background:#FEE2E2;color:#991B1B}

/* Forms */
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.4px}
.in{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:15px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{padding:9px 13px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600}
.pick button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{width:100%;padding:15px;border-radius:14px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;margin-top:18px}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#fff;color:var(--loss);border:1px solid var(--line);margin-top:10px}
.goalrow{display:grid;grid-template-columns:1fr 1fr 36px;gap:6px;margin-top:6px}
.goalrow button{color:var(--loss);font-weight:800;font-size:18px}
.add{margin-top:8px;font-weight:700;color:var(--navy-2);font-size:14px;padding:6px 0}
.check{display:flex;flex-wrap:wrap;gap:6px}
.check button{padding:8px 11px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600}
.check button.on{background:#DCFCE7;border-color:#86EFAC;color:#166534}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:18px 0 6px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="crest">AFC</div>
    <div><h1>Akaal FC</h1><small id="season">Saison 2026-2027</small></div>
    <button class="role" id="roleBtn"></button>
  </div>
</header>

<main class="wrap" id="view"></main>

<button class="fab" id="fab" hidden>+ Match</button>

<nav>
  <div class="wrap">
    <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
    <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/></svg>Calendrier</button>
    <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
    <button data-tab="squad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.3 0 4 1.5 4.5 4"/></svg>Effectif</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   AKAAL FC — version démo (données fictives, rien n'est enregistré
   en ligne). Firebase remplacera l'objet `db` plus tard.
   ============================================================ */

const TYPES = ['Championnat FSGT','Amical','Tournoi','Coupe'];
const FORMATS = ['7','8','11'];
const POSTES = ['Gardien','Défenseur','Milieu','Attaquant'];

// ---------- Données de démo ----------
const db = {
  players: [
    {id:'p1', name:'Simratpal', num:10, poste:'Milieu', cap:true},
    {id:'p2', name:'Arjun', num:1, poste:'Gardien'},
    {id:'p3', name:'Karan', num:4, poste:'Défenseur'},
    {id:'p4', name:'Harpreet', num:5, poste:'Défenseur'},
    {id:'p5', name:'Gurvinder', num:8, poste:'Milieu'},
    {id:'p6', name:'Manpreet', num:7, poste:'Attaquant'},
    {id:'p7', name:'Jaspreet', num:9, poste:'Attaquant'},
    {id:'p8', name:'Amandeep', num:11, poste:'Milieu'},
    {id:'p9', name:'Ravinder', num:3, poste:'Défenseur'},
    {id:'p10', name:'Sukhdev', num:14, poste:'Attaquant'},
  ],
  matches: [],
  goals: [],      // {match, scorer, assist}
  presence: {},   // presence[matchId][playerId] = 'yes'|'no'
  played: {},     // played[matchId] = [playerIds]
};
(function seed(){
  const d = (days,h) => { const x = new Date(); x.setHours(0,0,0,0); x.setDate(x.getDate()+days); const [hh,mm]=h.split(':'); x.setHours(+hh,+mm); return x.toISOString(); };
  const M = (id,days,h,opp,type,format,home,place,us,them,motm) => ({id,date:d(days,h),opp,type,format,home,place,us,them,motm,played:us!=null});
  db.matches = [
    M('m1',-27,'21:00','FC Bondy United','Championnat FSGT','7',true,'Stade Delaune, Bobigny',3,1,'p6'),
    M('m2',-22,'10:30','Real Pantin','Amical','8',false,'Parc des Sports, Pantin',2,2,'p2'),
    M('m3',-20,'21:00','AS Drancy 7','Championnat FSGT','7',false,'Gymnase Joliot-Curie, Drancy',1,2,'p5'),
    M('m4',-13,'21:00','Olympique Noisy','Championnat FSGT','7',true,'Stade Delaune, Bobigny',4,0,'p7'),
    M('m5',-8,'09:00','Tournoi Vaisakhi','Tournoi','11',true,'Stade de la Motte, Bobigny',2,1,'p1'),
    M('m6',-6,'21:00','Les Lions de Bagnolet','Championnat FSGT','7',false,'Stade Le Bris, Bagnolet',3,3,'p10'),
    M('m7',1,'21:00','Sporting Romainville','Championnat FSGT','7',true,'Stade Delaune, Bobigny',null,null,null),
    M('m8',6,'10:00','Punjab FC','Amical','8',true,'Stade de la Motte, Bobigny',null,null,null),
    M('m9',8,'21:00','Bobigny Academy','Championnat FSGT','7',false,'Stade Auguste-Delaune, Bobigny',null,null,null),
    M('m10',15,'21:00','FC Montreuil 7','Championnat FSGT','7',true,'Stade Delaune, Bobigny',null,null,null),
  ];
  const G = (match,scorer,assist) => db.goals.push({match,scorer,assist});
  G('m1','p6','p1');G('m1','p7','p5');G('m1','p6',null);
  G('m2','p7','p8');G('m2','p1','p6');
  G('m3','p10','p1');
  G('m4','p7','p1');G('m4','p6','p7');G('m4','p7','p5');G('m4','p8','p6');
  G('m5','p1','p8');G('m5','p6','p1');
  G('m6','p10','p7');G('m6','p6','p1');G('m6','csc',null);
  const all = db.players.map(p=>p.id);
  db.played = {m1:all.slice(0,9),m2:all.slice(0,8).concat('p10'),m3:all,m4:all.slice(0,9),m5:all,m6:['p1','p2','p3','p5','p6','p7','p8','p10']};
  db.presence.m7 = {p2:'yes',p3:'yes',p5:'yes',p6:'no',p7:'yes',p9:'yes'};
  db.presence.m8 = {p3:'yes',p8:'no'};
})();

// ---------- État ----------
const state = { tab:'home', me:'p1', captain:true, calFilter:'Tous', statFilter:'Tous', board:'buts' };

// ---------- Utils ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = id => db.players.find(p=>p.id===id);
const pname = id => id==='csc' ? 'CSC' : (P(id)?.name || '?');
const initials = n => n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const JOURS = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MOIS_C = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fmtDay = iso => { const d=new Date(iso); return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS_C[d.getMonth()]}`; };
const fmtTime = iso => new Date(iso).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const res = m => !m.played ? null : m.us>m.them ? 'V' : m.us<m.them ? 'D' : 'N';
const sorted = () => [...db.matches].sort((a,b)=>a.date.localeCompare(b.date));
const upcoming = () => sorted().filter(m=>!m.played);
const past = () => sorted().filter(m=>m.played).reverse();
const typeShort = t => t==='Championnat FSGT' ? 'FSGT' : t;
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }
function countdown(iso){ const ms=new Date(iso)-new Date(); if(ms<0) return 'En cours'; const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5); return d>0?`Dans ${d} j ${h} h`:`Dans ${h} h`; }

// ---------- Rendu ----------
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));
  const rb=$('#roleBtn'); rb.textContent = state.captain ? '★ Capitaine' : 'Vue joueur'; rb.classList.toggle('cap',state.captain);
  $('#fab').hidden = !(state.captain && state.tab==='cal');
  $('#view').innerHTML = ({home,cal,stats,squad})[state.tab]();
  window.scrollTo(0,0);
}

function presenceCounts(id){ const p=db.presence[id]||{}; const y=Object.values(p).filter(v=>v==='yes').length, n=Object.values(p).filter(v=>v==='no').length; return {y,n,q:db.players.length-y-n}; }

function home(){
  const next = upcoming()[0], last = past()[0];
  let h = '';
  if(next){
    const mine=(db.presence[next.id]||{})[state.me], c=presenceCounts(next.id);
    h += `<div class="hero">
      <div class="chips"><span class="chip gold">Prochain match</span><span class="chip">${esc(typeShort(next.type))}</span><span class="chip">Foot à ${next.format}</span></div>
      <div class="vs">
        <div class="team"><div class="b ${next.home?'us':'them'}">${next.home?'AFC':esc(initials(next.opp))}</div>${next.home?'Akaal FC':esc(next.opp)}</div>
        <div class="mid">VS</div>
        <div class="team"><div class="b ${next.home?'them':'us'}">${next.home?esc(initials(next.opp)):'AFC'}</div>${next.home?esc(next.opp):'Akaal FC'}</div>
      </div>
      <div class="when"><span><b>${fmtDay(next.date)}</b></span><span><b>${fmtTime(next.date)}</b></span><span>${esc(next.place)}</span></div>
      <div class="countdown">${countdown(next.date)}</div>
      <div class="avail">
        <button class="yes ${mine==='yes'?'on':''}" onclick="setPresence('${next.id}','yes')">✓ Présent</button>
        <button class="no ${mine==='no'?'on':''}" onclick="setPresence('${next.id}','no')">✕ Absent</button>
      </div>
      <div class="counts"><span><b>${c.y}</b> présents</span><span><b>${c.n}</b> absents</span><span><b>${c.q}</b> sans réponse</span></div>
    </div>`;
    h += `<button class="note" style="display:block;margin:10px auto 0;color:var(--navy-2);font-weight:700" onclick="openMatch('${next.id}')">Voir qui vient →</button>`;
  }
  if(last){
    const r=res(last);
    h += `<h2 class="sec">Dernier résultat</h2>
      <div class="card result row click" onclick="openMatch('${last.id}')">
        <div class="badge ${r}">${r}</div>
        <div class="t"><b>${last.home?'Akaal FC – '+esc(last.opp):esc(last.opp)+' – Akaal FC'}</b><span>${fmtDay(last.date)} · ${esc(typeShort(last.type))} · à ${last.format}</span></div>
        <div class="score">${last.home?last.us+'-'+last.them:last.them+'-'+last.us}</div>
      </div>`;
  }
  const s = seasonStats('Tous');
  h += `<h2 class="sec">La saison</h2>
    <div class="kpis">
      <div class="card kpi"><b>${s.j}</b><span>Joués</span></div>
      <div class="card kpi"><b style="color:var(--win)">${s.v}</b><span>Victoires</span></div>
      <div class="card kpi"><b>${s.n}</b><span>Nuls</span></div>
      <div class="card kpi"><b style="color:var(--loss)">${s.d}</b><span>Défaites</span></div>
    </div>`;
  const top = board('buts','Tous').slice(0,3);
  if(top.length){
    h += `<h2 class="sec">Meilleurs buteurs</h2><div class="card list lb">${top.map((p,i)=>`
      <div class="row"><div class="rank ${i===0?'r1':''}">${i+1}</div><div class="av">${esc(initials(p.name))}</div><div class="t"><b>${esc(p.name)}</b><span>${esc(p.poste)}</span></div><div class="val">${p.v}</div></div>`).join('')}</div>`;
  }
  return h + `<p class="note">Version démo · données fictives</p>`;
}

function filterBar(key, val){
  return `<div class="filters">${['Tous',...TYPES].map(t=>`<button class="${val===t?'on':''}" onclick="state.${key}='${t}';render()">${t==='Championnat FSGT'?'FSGT':t}</button>`).join('')}</div>`;
}

function matchRow(m){
  const r=res(m), d=new Date(m.date);
  const right = m.played ? `<div class="badge ${r}" style="width:auto;padding:0 9px">${m.us}-${m.them}</div>` : `<span class="chip lt">${fmtTime(m.date)}</span>`;
  return `<div class="row click" onclick="openMatch('${m.id}')">
    <div class="date"><b>${d.getDate()}</b><span>${JOURS[d.getDay()]}</span></div>
    <div class="t"><b>${m.home?'':'@ '}${esc(m.opp)}</b><span>${esc(typeShort(m.type))} · à ${m.format} · ${esc(m.place)}</span></div>
    ${right}</div>`;
}

function cal(){
  const f = state.calFilter;
  const ms = sorted().filter(m=>f==='Tous'||m.type===f);
  let h = filterBar('calFilter', f);
  const up = ms.filter(m=>!m.played), pa = ms.filter(m=>m.played).reverse();
  const group = (list) => { let out='', cur=''; list.forEach(m=>{ const d=new Date(m.date), k=MOIS[d.getMonth()]+' '+d.getFullYear(); if(k!==cur){ if(cur) out+='</div>'; out+=`<div class="month">${k}</div><div class="card list">`; cur=k; } out+=matchRow(m); }); return out+(cur?'</div>':''); };
  h += `<h2 class="sec">À venir</h2>` + (up.length?group(up):`<div class="card empty">Aucun match prévu</div>`);
  h += `<h2 class="sec">Résultats</h2>` + (pa.length?group(pa):`<div class="card empty">Aucun résultat</div>`);
  return h;
}

function seasonStats(f){
  const ms = db.matches.filter(m=>m.played && (f==='Tous'||m.type===f));
  const s={j:ms.length,v:0,n:0,d:0,bp:0,bc:0};
  ms.forEach(m=>{ const r=res(m); s[r==='V'?'v':r==='N'?'n':'d']++; s.bp+=m.us; s.bc+=m.them; });
  return s;
}
function board(kind,f){
  const ids = new Set(db.matches.filter(m=>m.played&&(f==='Tous'||m.type===f)).map(m=>m.id));
  const tally = {};
  const add = (id) => { if(id && id!=='csc') tally[id]=(tally[id]||0)+1; };
  if(kind==='buts') db.goals.filter(g=>ids.has(g.match)).forEach(g=>add(g.scorer));
  if(kind==='passes') db.goals.filter(g=>ids.has(g.match)).forEach(g=>add(g.assist));
  if(kind==='motm') db.matches.filter(m=>ids.has(m.id)).forEach(m=>add(m.motm));
  if(kind==='matchs') Object.entries(db.played).filter(([k])=>ids.has(k)).forEach(([,l])=>l.forEach(add));
  return Object.entries(tally).map(([id,v])=>({...P(id),v})).filter(p=>p.name).sort((a,b)=>b.v-a.v||a.name.localeCompare(b.name));
}

function stats(){
  const f=state.statFilter, s=seasonStats(f);
  let h = filterBar('statFilter', f);
  h += `<h2 class="sec">Bilan</h2>
    <div class="kpis">
      <div class="card kpi"><b style="color:var(--win)">${s.v}</b><span>V</span></div>
      <div class="card kpi"><b>${s.n}</b><span>N</span></div>
      <div class="card kpi"><b style="color:var(--loss)">${s.d}</b><span>D</span></div>
      <div class="card kpi"><b>${s.bp-s.bc>0?'+':''}${s.bp-s.bc}</b><span>Diff.</span></div>
    </div>
    <div class="kpis" style="grid-template-columns:1fr 1fr;margin-top:8px">
      <div class="card kpi"><b>${s.bp}</b><span>Buts marqués</span></div>
      <div class="card kpi"><b>${s.bc}</b><span>Buts encaissés</span></div>
    </div>`;
  const labels={buts:'Buts',passes:'Passes',motm:'H. du match',matchs:'Matchs'};
  h += `<h2 class="sec">Classements</h2><div class="seg">${Object.entries(labels).map(([k,l])=>`<button class="${state.board===k?'on':''}" onclick="state.board='${k}';render()">${l}</button>`).join('')}</div>`;
  const b = board(state.board,f), max = b[0]?.v||1;
  h += `<div class="card list lb" style="margin-top:10px">${b.length?b.map((p,i)=>`
    <div class="row"><div class="rank ${i===0?'r1':''}">${i+1}</div><div class="av">${esc(initials(p.name))}</div>
    <div class="t"><b>${esc(p.name)}</b><div class="bar"><i style="width:${p.v/max*100}%"></i></div></div><div class="val">${p.v}</div></div>`).join(''):'<div class="empty">Pas encore de données</div>'}</div>`;
  return h;
}

function playerLine(id){
  const g=db.goals.filter(x=>x.scorer===id).length, a=db.goals.filter(x=>x.assist===id).length;
  const j=Object.values(db.played).filter(l=>l.includes(id)).length, mo=db.matches.filter(m=>m.motm===id).length;
  return {g,a,j,mo};
}
function squad(){
  const order = POSTES;
  let h = '';
  order.forEach(po=>{
    const ps = db.players.filter(p=>p.poste===po).sort((a,b)=>a.num-b.num);
    if(!ps.length) return;
    h += `<h2 class="sec">${po}s</h2><div class="card list">${ps.map(p=>{ const s=playerLine(p.id); return `
      <div class="row ${state.captain?'click':''}" ${state.captain?`onclick="editPlayer('${p.id}')"`:''}>
        <div class="av" style="background:var(--navy);color:var(--gold)">${p.num}</div>
        <div class="t"><b>${esc(p.name)}${p.cap?' <span class="chip gold" style="font-size:9px;vertical-align:2px">C</span>':''}</b><span>${s.j} matchs · ${s.g} buts · ${s.a} passes${s.mo?` · ${s.mo}★`:''}</span></div>
      </div>`; }).join('')}</div>`;
  });
  if(state.captain) h += `<button class="btn gold" onclick="editPlayer()">+ Ajouter un joueur</button>`;
  return h;
}

// ---------- Actions ----------
function setPresence(mid, v){
  db.presence[mid] = db.presence[mid]||{};
  db.presence[mid][state.me] = db.presence[mid][state.me]===v ? undefined : v;
  if(!db.presence[mid][state.me]) delete db.presence[mid][state.me];
  toast(v==='yes'?'Présence enregistrée ✓':'Absence enregistrée');
  render();
}

function openSheet(html){ $('#sheet').innerHTML = `<div class="grab"></div>`+html; $('#sheetBg').classList.add('open'); }
function closeSheet(){ $('#sheetBg').classList.remove('open'); }
$('#sheetBg').addEventListener('click', e=>{ if(e.target.id==='sheetBg') closeSheet(); });

function openMatch(id){
  const m = db.matches.find(x=>x.id===id); if(!m) return;
  const usN='Akaal FC', L=m.home?usN:m.opp, R=m.home?m.opp:usN, sL=m.home?m.us:m.them, sR=m.home?m.them:m.us;
  let h = `<button class="close" onclick="closeSheet()">Fermer</button>
    <div class="chips" style="margin-bottom:12px"><span class="chip lt">${esc(m.type)}</span><span class="chip lt">Foot à ${m.format}</span><span class="chip lt">${m.home?'Domicile':'Extérieur'}</span></div>
    <div class="bigscore">
      <div class="score">${m.played?`${sL} - ${sR}`:fmtTime(m.date)}</div>
      <div class="names"><span>${esc(L)}</span><span>${esc(R)}</span></div>
      <div style="font-size:12px;color:#AEB8D6;margin-top:8px">${fmtDay(m.date)} · ${esc(m.place)}</div>
    </div>`;
  if(m.played){
    const gs = db.goals.filter(g=>g.match===id);
    h += `<h2 class="sec">Buts</h2><div class="card">${gs.length?gs.map(g=>`<div class="ev">⚽ <b>${esc(pname(g.scorer))}</b>${g.assist?` <small>passe de ${esc(pname(g.assist))}</small>`:''}</div>`).join(''):'<div class="empty">Aucun but</div>'}</div>`;
    if(m.motm) h += `<h2 class="sec">Homme du match</h2><div class="card motm"><div class="av" style="background:var(--gold);color:var(--navy)">★</div><b>${esc(pname(m.motm))}</b></div>`;
    const pl = db.played[id]||[];
    h += `<h2 class="sec">Ont joué (${pl.length})</h2><div class="card pl">${pl.map(p=>`<span>${esc(pname(p))}</span>`).join('')||'<div class="empty">—</div>'}</div>`;
  } else {
    const pr = db.presence[id]||{}, mine=pr[state.me];
    h += `<div class="avail" style="margin-top:14px"><button class="yes ${mine==='yes'?'on':''}" style="background:${mine==='yes'?'var(--win)':'#fff'};color:${mine==='yes'?'#fff':'var(--ink)'}" onclick="setPresence('${id}','yes');openMatch('${id}')">✓ Présent</button><button class="no ${mine==='no'?'on':''}" style="background:${mine==='no'?'var(--loss)':'#fff'};color:${mine==='no'?'#fff':'var(--ink)'}" onclick="setPresence('${id}','no');openMatch('${id}')">✕ Absent</button></div>`;
    const grp = v => db.players.filter(p=>(pr[p.id]||'q')===v);
    h += `<h2 class="sec">Présents (${grp('yes').length})</h2><div class="card pl">${grp('yes').map(p=>`<span class="y">${esc(p.name)}</span>`).join('')||'<span>Personne pour l’instant</span>'}</div>`;
    h += `<h2 class="sec">Absents (${grp('no').length})</h2><div class="card pl">${grp('no').map(p=>`<span class="n">${esc(p.name)}</span>`).join('')||'<span>—</span>'}</div>`;
    h += `<h2 class="sec">Sans réponse (${grp('q').length})</h2><div class="card pl">${grp('q').map(p=>`<span>${esc(p.name)}</span>`).join('')||'<span>—</span>'}</div>`;
  }
  if(state.captain){
    h += `<button class="btn gold" onclick="editResult('${id}')">${m.played?'Modifier le résultat':'Saisir le résultat'}</button>`;
    h += `<button class="btn" style="margin-top:10px" onclick="editMatch('${id}')">Modifier le match</button>`;
  }
  openSheet(h);
}

// --- Formulaire match (capitaine)
let draft = null;
function editMatch(id){
  const m = id ? db.matches.find(x=>x.id===id) : null;
  const d = m ? new Date(m.date) : new Date(Date.now()+864e5);
  const pad=n=>String(n).padStart(2,'0');
  draft = { id: m?.id, type: m?.type||'Championnat FSGT', format: m?.format||'7', home: m?m.home:true };
  const pick=(key,opts,lab=x=>x)=>`<div class="pick" id="pk-${key}">${opts.map(o=>`<button type="button" class="${String(draft[key])===String(o)?'on':''}" onclick="draft.${key}=${typeof o==='string'?`'${o}'`:o};document.querySelectorAll('#pk-${key} button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${lab(o)}</button>`).join('')}</div>`;
  openSheet(`<button class="close" onclick="closeSheet()">Annuler</button><h3>${m?'Modifier le match':'Nouveau match'}</h3>
    <label class="f">Adversaire</label><input class="in" id="f-opp" value="${esc(m?.opp||'')}" placeholder="Ex. FC Bondy">
    <label class="f">Type</label>${pick('type',TYPES)}
    <label class="f">Format</label>${pick('format',FORMATS,x=>'Foot à '+x)}
    <label class="f">Lieu</label>${pick('home',[true,false],x=>x?'Domicile':'Extérieur')}
    <div class="grid2"><div><label class="f">Date</label><input class="in" type="date" id="f-date" value="${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}"></div>
    <div><label class="f">Heure</label><input class="in" type="time" id="f-time" value="${m?pad(d.getHours())+':'+pad(d.getMinutes()):'21:00'}"></div></div>
    <label class="f">Stade / adresse</label><input class="in" id="f-place" value="${esc(m?.place||'')}" placeholder="Ex. Stade Delaune, Bobigny">
    <button class="btn gold" onclick="saveMatch()">Enregistrer</button>
    ${m?`<button class="btn ghost" onclick="deleteMatch('${m.id}')">Supprimer le match</button>`:''}`);
}
function saveMatch(){
  const opp=$('#f-opp').value.trim(); if(!opp) return toast('Indique l’adversaire');
  const date=new Date($('#f-date').value+'T'+$('#f-time').value).toISOString();
  const data={opp,date,place:$('#f-place').value.trim()||'Lieu à préciser',type:draft.type,format:draft.format,home:draft.home};
  if(draft.id) Object.assign(db.matches.find(x=>x.id===draft.id),data);
  else db.matches.push({id:'m'+Date.now(),...data,us:null,them:null,motm:null,played:false});
  closeSheet(); toast('Match enregistré'); render();
}
function deleteMatch(id){
  if(!confirm('Supprimer ce match ?')) return;
  db.matches=db.matches.filter(m=>m.id!==id); db.goals=db.goals.filter(g=>g.match!==id); delete db.presence[id]; delete db.played[id];
  closeSheet(); toast('Match supprimé'); render();
}

// --- Saisie du résultat (capitaine)
function editResult(id){
  const m=db.matches.find(x=>x.id===id);
  const pr=db.presence[id]||{};
  draft={id, goals: db.goals.filter(g=>g.match===id).map(g=>({...g})), played: new Set(db.played[id] || db.players.filter(p=>pr[p.id]==='yes').map(p=>p.id)), motm:m.motm};
  renderResult();
}
function renderResult(){
  const m=db.matches.find(x=>x.id===draft.id);
  const opts=(sel,withNone,withCsc)=>`${withNone?`<option value="">— aucun —</option>`:''}${withCsc?`<option value="csc" ${sel==='csc'?'selected':''}>CSC (contre son camp)</option>`:''}${db.players.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}`;
  openSheet(`<button class="close" onclick="closeSheet()">Annuler</button><h3>Résultat vs ${esc(m.opp)}</h3>
    <div class="grid2"><div><label class="f">Akaal FC</label><input class="in" type="number" min="0" id="r-us" value="${m.us??''}" style="font-size:22px;font-weight:800;text-align:center"></div>
    <div><label class="f">${esc(m.opp)}</label><input class="in" type="number" min="0" id="r-them" value="${m.them??''}" style="font-size:22px;font-weight:800;text-align:center"></div></div>
    <label class="f">Buteurs et passeurs</label>
    <div id="goals">${draft.goals.map((g,i)=>`<div class="goalrow"><select class="in" onchange="draft.goals[${i}].scorer=this.value">${opts(g.scorer,false,true)}</select><select class="in" onchange="draft.goals[${i}].assist=this.value||null">${opts(g.assist,true)}</select><button onclick="syncResult();draft.goals.splice(${i},1);renderResult()">×</button></div>`).join('')}</div>
    <button class="add" onclick="syncResult();draft.goals.push({match:draft.id,scorer:db.players[0].id,assist:null});renderResult()">+ Ajouter un but</button>
    <label class="f">Ont joué (${draft.played.size})</label>
    <div class="check">${db.players.map(p=>`<button class="${draft.played.has(p.id)?'on':''}" onclick="syncResult();draft.played.has('${p.id}')?draft.played.delete('${p.id}'):draft.played.add('${p.id}');renderResult()">${esc(p.name)}</button>`).join('')}</div>
    <label class="f">Homme du match</label><select class="in" id="r-motm">${opts(draft.motm,true)}</select>
    <button class="btn gold" onclick="saveResult()">Valider le résultat</button>`);
  if(draft.us!=null){ $('#r-us').value=draft.us; $('#r-them').value=draft.them; }
}
function syncResult(){ draft.us=$('#r-us').value; draft.them=$('#r-them').value; draft.motm=$('#r-motm').value||null; }
function saveResult(){
  syncResult();
  const m=db.matches.find(x=>x.id===draft.id);
  if(draft.us===''||draft.them==='') return toast('Indique le score');
  const us=+draft.us;
  if(draft.goals.length!==us && !confirm(`Le score indique ${us} but(s) mais tu as saisi ${draft.goals.length} buteur(s). Valider quand même ?`)) return;
  Object.assign(m,{us,them:+draft.them,motm:draft.motm,played:true});
  db.goals=db.goals.filter(g=>g.match!==m.id).concat(draft.goals.map(g=>({...g,match:m.id})));
  db.played[m.id]=[...draft.played];
  closeSheet(); toast('Résultat enregistré ⚽'); render();
}

// --- Joueurs (capitaine)
function editPlayer(id){
  const p=id?P(id):null;
  draft={id, poste:p?.poste||'Milieu'};
  openSheet(`<button class="close" onclick="closeSheet()">Annuler</button><h3>${p?'Modifier le joueur':'Nouveau joueur'}</h3>
    <div class="grid2" style="grid-template-columns:2fr 1fr"><div><label class="f">Nom</label><input class="in" id="j-name" value="${esc(p?.name||'')}"></div>
    <div><label class="f">Numéro</label><input class="in" type="number" id="j-num" value="${p?.num??''}"></div></div>
    <label class="f">Poste</label><div class="pick" id="pk-poste">${POSTES.map(o=>`<button class="${draft.poste===o?'on':''}" onclick="draft.poste='${o}';document.querySelectorAll('#pk-poste button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${o}</button>`).join('')}</div>
    <button class="btn gold" onclick="savePlayer()">Enregistrer</button>
    ${p&&!p.cap?`<button class="btn ghost" onclick="deletePlayer('${p.id}')">Retirer de l’effectif</button>`:''}`);
}
function savePlayer(){
  const name=$('#j-name').value.trim(); if(!name) return toast('Indique le nom');
  const data={name,num:+$('#j-num').value||0,poste:draft.poste};
  if(draft.id) Object.assign(P(draft.id),data); else db.players.push({id:'p'+Date.now(),...data});
  closeSheet(); toast('Effectif mis à jour'); render();
}
function deletePlayer(id){ if(!confirm('Retirer ce joueur ?')) return; db.players=db.players.filter(p=>p.id!==id); closeSheet(); render(); }

// ---------- Navigation ----------
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();});
$('#fab').onclick=()=>editMatch();
$('#roleBtn').onclick=()=>{ state.captain=!state.captain; state.me = state.captain?'p1':'p3'; toast(state.captain?'Mode capitaine':'Aperçu : vue d’un joueur'); render(); };
render();
</script>
</body>
</html>
